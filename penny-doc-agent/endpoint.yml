# Penny Document Agent - Azure ML Endpoint Configuration
# Defines the managed online endpoint for PDF extraction and document understanding
# Part of Penny's civic engagement AI platform

$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineEndpoint.schema.json

name: penny-doc-endpoint
description: "Document extraction endpoint for Penny's civic engagement AI - processes PDFs and civic documents for accessible information"

auth_mode: key

properties:
  enforce_access_to_default_secret_stores: false

tags:
  project: penny-civic-ai
  service: document-extraction
  environment: production
  managed_by: azure-ml
  version: "1.0"

public_network_access: enabled

traffic:
  penny-doc-agent-deployment: 100

mirror_traffic: {}