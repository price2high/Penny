# Penny Bias Detection Agent - Azure ML Endpoint Configuration
# Defines the managed online endpoint for bias detection service
# Part of Penny's civic engagement AI platform

$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineEndpoint.schema.json

name: penny-bias-endpoint
description: "Bias detection endpoint for Penny's civic engagement AI - ensures fair and equitable information delivery"

auth_mode: key

properties:
  enforce_access_to_default_secret_stores: false

tags:
  project: penny-civic-ai
  service: bias-detection
  environment: production
  managed_by: azure-ml
  version: "1.0"

public_network_access: enabled

traffic:
  penny-bias-agent-deployment: 100

mirror_traffic: {}