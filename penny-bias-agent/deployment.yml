# Penny Bias Detection Agent - Azure ML Deployment Configuration
# Defines the deployment settings for bias-checker scoring endpoint
# Part of Penny's civic engagement AI platform

$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json

name: penny-bias-agent-deployment
endpoint_name: penny-bias-endpoint

model:
  path: .
  name: penny-bias-checker
  version: 1

code_configuration:
  code: .
  scoring_script: score.py

environment:
  name: penny-bias-agent-env
  version: 1
  conda_file: conda.yaml
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04:latest

instance_type: Standard_DS3_v2
instance_count: 1

request_settings:
  request_timeout_ms: 20000
  max_concurrent_requests_per_instance: 5
  max_queue_wait_ms: 10000

liveness_route:
  path: /health
  port: 8000

readiness_route:
  path: /ready
  port: 8000

scoring_route:
  path: /score
  port: 8000

deployment_settings:
  min_instances: 1
  max_instances: 3
  scale_settings:
    scale_type: manual

app_insights_enabled: true