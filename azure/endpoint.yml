# Azure ML Endpoint Configuration for PENNY Main Application
# Defines the managed online endpoint for Penny's civic engagement AI

$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineEndpoint.schema.json

name: penny-main-endpoint
description: "Penny's main civic engagement AI endpoint - routes requests to specialized agents"

auth_mode: key

properties:
  enforce_access_to_default_secret_stores: false

tags:
  project: penny-civic-ai
  service: main-api
  environment: production
  managed_by: azure-ml
  version: "2.0"

public_network_access: enabled

traffic:
  penny-main-deployment: 100

mirror_traffic: {}

