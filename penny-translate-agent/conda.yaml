# Penny Translation Agent - Azure ML Environment Configuration
# Production-grade conda environment for multilingual translation service
# Deployed as part of Penny's civic engagement AI platform for accessible civic information

name: penny-translate-agent-env

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10.12
  - pip=23.3.1

  - pip:
      # Core ML Framework
      - torch==2.1.0
      - transformers==4.35.2
      
      # Translation Model Requirements
      - sentencepiece==0.1.99
      - sacremoses==0.1.1
      - protobuf==4.25.1
      
      # Azure ML Integration
      - azureml-defaults==1.55.0
      - azureml-inference-server-http==0.8.6
      
      # Model Dependencies
      - numpy==1.24.3
      - scipy==1.11.4
      - scikit-learn==1.3.2
      
      # Text Processing & Language Detection
      - langdetect==1.0.9
      - ftfy==6.1.3
      
      # Performance & Optimization
      - accelerate==0.25.0
      
      # Utilities
      - requests==2.31.0
      - pyyaml==6.0.1
      
      # Logging & Monitoring
      - python-json-logger==2.0.7