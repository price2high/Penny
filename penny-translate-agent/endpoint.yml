# Penny Translation Agent - Azure ML Endpoint Configuration
# Defines the managed online endpoint for multilingual translation service
# Part of Penny's civic engagement AI platform for accessible civic information

$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineEndpoint.schema.json

name: penny-translate-endpoint
description: "Multilingual translation endpoint for Penny's civic engagement AI - provides accessible civic information across 200+ languages"

auth_mode: key

properties:
  enforce_access_to_default_secret_stores: false

tags:
  project: penny-civic-ai
  service: translation
  environment: production
  managed_by: azure-ml
  version: "1.0"

public_network_access: enabled

traffic:
  penny-translate-agent-deployment: 100

mirror_traffic: {}